name: Sentinel CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-engine:
    name: Test Engine (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=. python -m unittest discover -s engine/tests -v

  validate-browser-engine:
    name: Browser parity, extension safety, and packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify Python-owned fixtures are current
        run: |
          PYTHONPATH=. python3 engine/tests/generate_browser_fixtures.py "$RUNNER_TEMP/browser-engine-parity.json"
          cmp tests/fixtures/browser-engine-parity.json "$RUNNER_TEMP/browser-engine-parity.json"
      - name: Run browser, Pages, and extension tests
        run: node --test tests/*.test.js
      - name: Verify extension engine is byte-identical
        run: cmp shared/sentinel-engine.js extension/shared/sentinel-engine.js
      - name: Validate Manifest V3 permissions and script order
        run: |
          node -e '
            const m = require("./extension/manifest.json");
            if (m.manifest_version !== 3) throw new Error("Must be Manifest V3");
            const content = m.content_scripts[0];
            if (JSON.stringify(content.matches) !== JSON.stringify(["<all_urls>"])) throw new Error("Expected <all_urls>");
            const expected = ["shared/sentinel-engine.js", "site-policy.js", "paste-controller.js", "content.js"];
            if (JSON.stringify(content.js) !== JSON.stringify(expected)) throw new Error("Incorrect content-script order");
            if ((m.host_permissions || []).length) throw new Error("Unexpected host permissions");
          '
      - name: Syntax-check JavaScript
        run: |
          node --check shared/sentinel-engine.js
          node --check demo-client/app.js
          node --check extension/paste-controller.js
          node --check extension/content.js
