name: Sentinel CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-engine:
    name: Test Engine (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sentinel test suite
        run: |
          python -m unittest discover -s engine/tests -v

  validate-client-and-extension:
    name: Validate Web Client & Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate Manifest V3 JSON
        run: |
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("extension/manifest.json", "utf8"));
            if (manifest.manifest_version !== 3) throw new Error("Must be Manifest V3");
            console.log("Manifest V3 valid:", manifest.name, "v" + manifest.version);
          '

      - name: Syntax check client and extension JavaScript
        run: |
          node --check demo-client/app.js
          node --check extension/background.js
          node --check extension/content.js
          echo "All JavaScript files passed syntax verification."
